name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest

    env:
      # Build needs *something* in these so process.env reads don't crash.
      # CI is not allowed to touch the real database — the build only needs
      # them to exist, not to point anywhere real.
      DATABASE_URL: "mysql://user:pass@localhost:3306/test"
      AUTH_SECRET: "ci-only-not-a-real-secret-do-not-use-anywhere-else"
      # `web-push` validates VAPID key shape eagerly when `setVapidDetails`
      # is called. These are throwaway CI-only keys generated once with
      # `npx web-push generate-vapid-keys` — they aren't tied to any
      # real push subscription and only exist so the build's page-data
      # collection can import notification code without crashing.
      VAPID_PUBLIC_KEY: "BLwJGo5X8P9NHTluwbsp7fXGJA7AuCQ3Y9rEqui2sCO7MFwetCa0T28U9Mg9uYiid2sBQpts7r5sR2gXz_JYeUg"
      VAPID_PRIVATE_KEY: "XzWU641VJdGqbUHs4CfRblJC-x0K_Yy-KETYv0bM7G0"
      VAPID_SUBJECT: "mailto:ci@example.com"
      XERO_CLIENT_ID: "ci-placeholder"
      XERO_CLIENT_SECRET: "ci-placeholder"
      XERO_REDIRECT_URI: "http://localhost:3000/api/xero/callback"
      CRON_SECRET: "ci-placeholder"
      AI_PROVIDER: "groq"
      GROQ_API_KEY: "ci-placeholder"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Lint enforces the layered-architecture rule (`no-restricted-imports`
      # on @/lib/prisma) as a hard error. Other rules — mostly pre-existing
      # React 19 strict-mode warnings — are visible in the logs but do not
      # fail the build. Tighten with `--max-warnings=0` once the React-19
      # cleanup ships.
      - name: Lint (eslint)
        run: npx eslint .

      - name: Type-check (tsc)
        run: npx tsc --noEmit --incremental false

      - name: Unit tests (vitest)
        run: npm test -- --reporter=default

      - name: Build (next build)
        run: npm run build
