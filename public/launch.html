<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D5E6B" />
    <title>Opening ClaimGuard</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f7f9fb;
        --surface: rgba(255, 255, 255, 0.92);
        --foreground: #191c1e;
        --muted: #5d6470;
        --primary: #0a396c;
        --primary-soft: rgba(10, 57, 108, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        background:
          radial-gradient(circle at top left, rgba(42, 80, 132, 0.16), transparent 42%),
          radial-gradient(circle at top right, rgba(203, 231, 245, 0.4), transparent 28%),
          var(--background);
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: Manrope, Inter, system-ui, sans-serif;
        color: var(--foreground);
        padding: calc(24px + env(safe-area-inset-top))
          calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
      }

      main {
        width: min(100%, 448px);
        border: 1px solid rgba(10, 57, 108, 0.08);
        background: var(--surface);
        backdrop-filter: blur(18px);
        border-radius: 28px;
        padding: 36px 32px;
        box-shadow: 0 20px 60px rgba(10, 57, 108, 0.1);
        text-align: center;
      }

      .brand-icon {
        width: 86px;
        height: auto;
      }

      .brand-wordmark {
        margin: 22px 0 0;
        font-size: 2rem;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #116372;
      }

      .spinner-wrap {
        margin-top: 20px;
        display: inline-flex;
        height: 44px;
        width: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 1px solid rgba(10, 57, 108, 0.15);
        background: var(--primary-soft);
      }

      .spinner {
        height: 20px;
        width: 20px;
        border-radius: 999px;
        border: 2px solid rgba(10, 57, 108, 0.18);
        border-top-color: var(--primary);
        animation: spin 0.9s linear infinite;
      }

      h1 {
        margin: 20px 0 0;
        font-size: 1.05rem;
      }

      p {
        margin: 8px 0 0;
        line-height: 1.6;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="brand-icon" src="/brand-icon.png" alt="ClaimGuard logo" />
      <div class="brand-wordmark">ClaimGuard</div>
      <div class="spinner-wrap" aria-hidden="true">
        <div class="spinner"></div>
      </div>
      <h1>Resuming ClaimGuard...</h1>
      <p id="status">Reconnecting to your workspace.</p>
    </main>

    <script>
      const status = document.getElementById("status")
      const RESUME_MARKER = "__cgresume"
      const RELOAD_GUARD_KEY = "claimguard:launch-reload-at"
      const RELOAD_GUARD_MS = 8000

      function buildResumeUrl() {
        const url = new URL(window.location.href)
        url.searchParams.set(RESUME_MARKER, "1")
        return url.toString()
      }

      function recentlyReloaded() {
        try {
          const last = Number(window.sessionStorage.getItem(RELOAD_GUARD_KEY) ?? "0")
          return Number.isFinite(last) && Date.now() - last < RELOAD_GUARD_MS
        } catch {
          return false
        }
      }

      function markReloadedNow() {
        try {
          window.sessionStorage.setItem(RELOAD_GUARD_KEY, String(Date.now()))
        } catch {
          // Ignore — the SW resume marker still breaks the loop.
        }
      }

      let attempts = 0

      async function probeAndResume() {
        attempts += 1

        try {
          const response = await fetch(window.location.href, {
            method: "GET",
            cache: "no-store",
            credentials: "include",
            headers: {
              "x-claimguard-resume-probe": "1",
            },
          })

          if (response.ok || response.redirected) {
            if (recentlyReloaded()) {
              status.textContent = "Almost there. Tap to retry if this stays a while."
            } else {
              markReloadedNow()
              window.location.replace(buildResumeUrl())
              return
            }
          } else {
            status.textContent = "Still reconnecting. Opening your last page shortly."
          }
        } catch {
          status.textContent =
            attempts > 2
              ? "Still waiting for a connection. ClaimGuard will continue once the app is reachable."
              : "Reconnecting to your workspace."
        }

        window.setTimeout(probeAndResume, attempts > 2 ? 1800 : 1200)
      }

      window.setTimeout(probeAndResume, 300)
    </script>
  </body>
</html>
