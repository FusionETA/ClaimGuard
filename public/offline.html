<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AltomateHR Offline</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f7f9fb;
        --surface: #ffffff;
        --foreground: #191c1e;
        --muted: #5d6470;
        --primary: #0a396c;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(42, 80, 132, 0.16), transparent 42%),
          radial-gradient(circle at top right, rgba(203, 231, 245, 0.4), transparent 28%),
          var(--background);
        font-family: Inter, system-ui, sans-serif;
        color: var(--foreground);
        padding: 24px;
      }

      main {
        width: min(100%, 480px);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        border-radius: 28px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(10, 57, 108, 0.1);
      }

      h1 {
        font-family: Manrope, Inter, system-ui, sans-serif;
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      strong {
        color: var(--primary);
      }

      button {
        margin-top: 20px;
        width: 100%;
        padding: 14px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #status {
        margin-top: 12px;
        font-size: 0.85rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re Offline</h1>
      <p>
        AltomateHR needs a connection to show your <strong>live</strong> attendance,
        leave and claim data — clock in/out state is never served from an offline
        copy, so it can’t show you the wrong button.
      </p>
      <button type="button" id="retry">Try again</button>
      <p id="status">Retrying automatically…</p>
    </main>
    <script>
      // Keep probing the page the user actually asked for. The service worker
      // shows this page when a navigation loses the 4s race, which on a flaky
      // site connection is often temporary — reload as soon as the network is
      // genuinely back so nobody is stranded here.
      (function () {
        var status = document.getElementById("status")
        var timer = null

        function probe() {
          var controller = new AbortController()
          var abortTimer = setTimeout(function () {
            controller.abort()
          }, 4000)

          fetch(location.href, {
            method: "HEAD",
            cache: "no-store",
            credentials: "include",
            signal: controller.signal,
          })
            .then(function () {
              clearTimeout(abortTimer)
              status.textContent = "Back online — reloading…"
              location.reload()
            })
            .catch(function () {
              clearTimeout(abortTimer)
            })
        }

        document.getElementById("retry").addEventListener("click", function () {
          status.textContent = "Reconnecting…"
          location.reload()
        })

        window.addEventListener("online", probe)
        timer = setInterval(probe, 5000)
        setTimeout(probe, 2000)
        window.addEventListener("pagehide", function () {
          clearInterval(timer)
        })
      })()
    </script>
  </body>
</html>
