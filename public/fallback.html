<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#4C1A86" />
    <title>AltomateHR — We&rsquo;ll be right back</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        /* tokens mirrored from the app (globals.css) */
        --background: hsl(268 30% 97%);
        --foreground: hsl(268 50% 10%);
        --card: hsl(268 35% 99%);
        --muted-foreground: hsl(268 12% 45%);
        --primary: hsl(268 68% 31%);          /* #4C1A86 */
        --primary-600: hsl(268 68% 27%);
        --border: hsl(268 22% 83%);
        --radius: 28px;
        --font: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: var(--font);
        color: var(--foreground);
        background-color: var(--background);
        /* clean, classy white with only a whisper of brand tint */
        background-image:
          radial-gradient(circle at top left, rgba(76, 26, 134, 0.05), transparent 46%),
          radial-gradient(circle at top right, rgba(154, 250, 227, 0.10), transparent 40%);
        -webkit-font-smoothing: antialiased;
      }

      /* Card — matches <Card> + login page */
      .card {
        width: min(100%, 460px);
        background: color-mix(in srgb, var(--card) 94%, transparent);
        border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
        border-radius: var(--radius);
        box-shadow: 0 18px 48px rgba(76, 26, 134, 0.10);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 32px 28px;
        text-align: center;
      }

      /* Logo tile — identical treatment to the login page */
      .logo-tile {
        width: 140px;
        height: 140px;
        margin: 0 auto 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        border-radius: var(--radius);
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 12px 30px rgba(76, 26, 134, 0.07);
      }
      .logo-tile img {
        width: 108px;
        height: auto;
        object-fit: contain;
        display: block;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      p.lead {
        margin: 0 auto;
        max-width: 34ch;
        line-height: 1.6;
        color: var(--muted-foreground);
        font-size: 0.97rem;
        font-weight: 500;
      }

      .status {
        margin: 24px auto 20px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(76, 26, 134, 0.07);
        color: var(--primary);
        font-size: 0.85rem;
        font-weight: 700;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--primary);
        animation: blink 1.2s ease-in-out infinite;
      }
      .dot.ok { background: hsl(166 68% 32%); animation: none; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: var(--primary);
        padding: 13px 30px;
        border-radius: 16px;
        box-shadow: 0 10px 24px rgba(76, 26, 134, 0.22);
        transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
      }
      button:hover { background: var(--primary-600); transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      button:disabled { opacity: 0.55; cursor: progress; transform: none; }

      .meta {
        margin: 22px 0 0;
        font-size: 0.78rem;
        color: var(--muted-foreground);
        opacity: 0.85;
        font-weight: 500;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: hsl(268 40% 7%);
          --foreground: hsl(268 20% 96%);
          --card: hsl(268 35% 11%);
          --muted-foreground: hsl(268 12% 70%);
          --primary: hsl(268 62% 67%);
          --primary-600: hsl(268 62% 60%);
          --border: hsl(268 22% 24%);
        }
        body {
          background-image:
            radial-gradient(circle at top left, rgba(76, 26, 134, 0.22), transparent 44%),
            radial-gradient(circle at top right, rgba(154, 250, 227, 0.06), transparent 38%);
        }
        .card { border-color: rgba(255, 255, 255, 0.10); }
        .logo-tile {
          background: rgba(255, 255, 255, 0.92);
          border-color: rgba(255, 255, 255, 0.5);
        }
        .status { background: rgba(154, 250, 227, 0.10); color: hsl(166 80% 68%); }
        .dot { background: hsl(166 80% 68%); }
        button { color: hsl(268 55% 8%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; }
      }
    </style>
  </head>

      <h1>We&rsquo;ll be right back</h1>
      <p class="lead">
        AltomateHR is finishing a quick update. This usually takes less than a
        minute &mdash; this page will refresh on its own the moment we&rsquo;re back.
      </p>

      <div class="status" id="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Reconnecting&hellip;</span>
      </div>

      <div>
        <button id="retryBtn" type="button">Try now</button>
      </div>

      <p class="meta">AltomateHR &middot; status updates automatically</p>
    </main>

    <script>
      (function () {
        var statusText = document.getElementById("statusText");
        var dot = document.getElementById("dot");
        var btn = document.getElementById("retryBtn");
        var checking = false;
        var attempt = 0;

        // Preview mode (/fallback.html?preview): render the page without the
        // auto-recovery probe, so it can be viewed while the app is healthy.
        if (location.search.indexOf("preview") !== -1) {
          dot.classList.add("ok");
          statusText.textContent = "Preview";
          btn.style.display = "none";
        } else {
          btn.addEventListener("click", function () { attempt = 0; check(); });
          document.addEventListener("visibilitychange", function () {
            if (!document.hidden) check();
          });
          setTimeout(check, 2000);
        }

        function check() {
          if (checking) return;
          checking = true;
          attempt++;
          btn.disabled = true;
          statusText.textContent = "Checking…";

          fetch("/?_fbcheck=" + Date.now(), {
            method: "HEAD",
            cache: "no-store",
            redirect: "manual",
          })
            .then(function (res) {
              // nginx serves THIS fallback with the original 502/503/504 status.
              // Anything else means Next.js is answering again — including auth
              // redirects (opaque) or 401/403.
              var down = res.status === 502 || res.status === 503 || res.status === 504;
              if (!down) recovered();
              else still();
            })
            .catch(function () {
              still();
            });
        }

        function recovered() {
          dot.classList.add("ok");
          statusText.textContent = "Back online — reloading…";
          setTimeout(function () { location.reload(); }, 600);
        }

        function still() {
          checking = false;
          btn.disabled = false;
          statusText.textContent = "Reconnecting…";
          schedule();
        }

        // Backoff: 3s, growing toward a 15s ceiling.
        function schedule() {
          var delay = Math.min(3000 + attempt * 1500, 15000);
          clearTimeout(window.__fbTimer);
          window.__fbTimer = setTimeout(check, delay);
        }
      })();
    </script>
